name: Deploy GamePrice to GitHub Pages

# Publishes the static site in docs/ to GitHub Pages.
# Runs on every push to the GamePrice branch, and can be triggered manually.
on:
  push:
    branches: [claude/game-price-scraper-k1c9l4]
    paths: [docs/**, .github/workflows/deploy-pages.yml]
  workflow_dispatch:

# Permissions the Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer runs supersede in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # enablement: true turns GitHub Pages on automatically the first time.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site (docs/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
