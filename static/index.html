<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GamePrice — cheapest PC game prices</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #181b22;
    --panel-2: #1f2330;
    --text: #e8eaf0;
    --muted: #9aa3b2;
    --accent: #5b8cff;
    --good: #3ad29f;
    --border: #2a2f3a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #1a2030, var(--bg));
    color: var(--text);
    min-height: 100vh;
  }
  header { text-align: center; padding: 48px 16px 24px; }
  h1 { margin: 0; font-size: 2rem; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin-top: 8px; font-size: 0.95rem; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 0 16px 64px; }
  form { display: flex; gap: 8px; margin: 24px auto 8px; max-width: 560px; }
  input[type=search] {
    flex: 1; padding: 14px 16px; font-size: 1rem; border-radius: 12px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    outline: none;
  }
  input[type=search]:focus { border-color: var(--accent); }
  button {
    padding: 0 20px; font-size: 1rem; font-weight: 600; border: none;
    border-radius: 12px; background: var(--accent); color: white; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .status { text-align: center; color: var(--muted); min-height: 22px; margin: 8px 0; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px; margin: 12px 0; display: flex; gap: 14px; align-items: center;
    cursor: pointer; transition: border-color .15s, transform .05s;
  }
  .card:hover { border-color: var(--accent); }
  .card:active { transform: scale(0.997); }
  .card img { width: 92px; height: 35px; object-fit: cover; border-radius: 6px; background: #000; flex: 0 0 auto; }
  .card .name { font-weight: 600; }
  .card .meta { color: var(--muted); font-size: 0.85rem; margin-top: 2px; }
  .card .from { margin-left: auto; text-align: right; flex: 0 0 auto; }
  .card .from .label { color: var(--muted); font-size: 0.75rem; }
  .card .from .price { color: var(--good); font-weight: 700; font-size: 1.15rem; }
  .deals { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; margin-top: 16px; }
  .deals .head { padding: 16px; display: flex; gap: 14px; align-items: center; border-bottom: 1px solid var(--border); }
  .deals .head img { width: 120px; height: 45px; object-fit: cover; border-radius: 6px; background:#000; }
  .deals .head .t { font-weight: 700; font-size: 1.1rem; }
  .deals .head .lowest { color: var(--muted); font-size: 0.85rem; margin-top: 2px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 0.95rem; }
  th { color: var(--muted); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; }
  tr:last-child td { border-bottom: none; }
  .price { color: var(--good); font-weight: 700; }
  .was { color: var(--muted); text-decoration: line-through; font-size: 0.85rem; margin-left: 6px; }
  .save { color: var(--good); font-size: 0.8rem; }
  .best td { background: rgba(58,210,159,0.06); }
  .badge { display: inline-block; background: var(--good); color:#06210f; font-size:0.7rem; font-weight:700; padding:2px 8px; border-radius:999px; margin-left:8px; vertical-align:middle; }
  a.buy { background: var(--accent); color: #fff; padding: 8px 16px; border-radius: 9px; text-decoration: none; font-weight: 600; font-size: 0.9rem; white-space: nowrap; }
  a.buy:hover { filter: brightness(1.1); }
  .back { background: none; color: var(--muted); border: 1px solid var(--border); padding: 8px 14px; border-radius: 10px; cursor: pointer; margin-bottom: 4px; }
  footer { text-align: center; color: var(--muted); font-size: 0.8rem; padding: 24px; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
  <header>
    <h1>Game<span>Price</span></h1>
    <div class="sub">Type a PC game name — find the cheapest place to buy it right now.</div>
  </header>
  <div class="wrap">
    <form id="searchForm">
      <input id="q" type="search" placeholder="e.g. Elden Ring, Hades, Cyberpunk 2077…" autocomplete="off" autofocus />
      <button id="goBtn" type="submit">Search</button>
    </form>
    <div class="status" id="status"></div>
    <div id="results"></div>
    <div id="dealsView"></div>
  </div>
  <footer>
    Prices via the free <a href="https://www.cheapshark.com/" target="_blank" rel="noopener">CheapShark</a> deals API.
    Buy links redirect to the store. Prices in USD.
  </footer>

<script>
const $ = (id) => document.getElementById(id);
const statusEl = $("status");
const resultsEl = $("results");
const dealsEl = $("dealsView");

function setStatus(msg) { statusEl.textContent = msg || ""; }
function money(v) { return v == null ? "—" : "$" + Number(v).toFixed(2); }

async function searchGames(title) {
  resultsEl.innerHTML = "";
  dealsEl.innerHTML = "";
  setStatus("Searching…");
  try {
    const res = await fetch("/api/search?title=" + encodeURIComponent(title));
    const data = await res.json();
    if (data.error) { setStatus("Error: " + data.error); return; }
    const games = data.results || [];
    if (!games.length) { setStatus('No games found for “' + title + '”.'); return; }
    setStatus(games.length + " match" + (games.length === 1 ? "" : "es") + " — pick one to see all store prices.");
    for (const g of games) {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <img src="${g.thumb || ''}" alt="" onerror="this.style.visibility='hidden'">
        <div>
          <div class="name">${escapeHtml(g.name || 'Unknown')}</div>
          <div class="meta">Click to compare prices across all stores</div>
        </div>
        <div class="from">
          <div class="label">from</div>
          <div class="price">${money(g.cheapest)}</div>
        </div>`;
      card.onclick = () => showDeals(g.gameID);
      resultsEl.appendChild(card);
    }
  } catch (e) {
    setStatus("Something went wrong: " + e.message);
  }
}

async function showDeals(gameID) {
  resultsEl.innerHTML = "";
  dealsEl.innerHTML = "";
  setStatus("Loading deals…");
  try {
    const res = await fetch("/api/deals?id=" + encodeURIComponent(gameID));
    const data = await res.json();
    if (data.error) { setStatus("Error: " + data.error); return; }
    setStatus("");
    renderDeals(data);
  } catch (e) {
    setStatus("Something went wrong: " + e.message);
  }
}

function renderDeals(data) {
  const deals = data.deals || [];
  const rows = deals.map((d, i) => {
    const cut = Number(d.retailPrice) > Number(d.price);
    return `<tr class="${i === 0 ? 'best' : ''}">
      <td>${escapeHtml(d.store)}${i === 0 ? '<span class="badge">CHEAPEST</span>' : ''}</td>
      <td><span class="price">${money(d.price)}</span>${cut ? `<span class="was">${money(d.retailPrice)}</span>` : ''}</td>
      <td>${d.savings > 0 ? `<span class="save">-${d.savings}%</span>` : ''}</td>
      <td style="text-align:right"><a class="buy" href="${d.buyURL}" target="_blank" rel="noopener">Buy →</a></td>
    </tr>`;
  }).join("");

  dealsEl.innerHTML = `
    <button class="back" onclick="backToResults()">← Back to results</button>
    <div class="deals">
      <div class="head">
        <img src="${data.thumb || ''}" alt="" onerror="this.style.visibility='hidden'">
        <div>
          <div class="t">${escapeHtml(data.title || 'Game')}</div>
          <div class="lowest">${deals.length} live offer${deals.length === 1 ? '' : 's'}${data.cheapestPriceEver ? ' · all-time low ' + money(data.cheapestPriceEver) : ''}</div>
        </div>
      </div>
      <table>
        <thead><tr><th>Store</th><th>Price</th><th>Save</th><th></th></tr></thead>
        <tbody>${rows || '<tr><td colspan="4">No current deals found.</td></tr>'}</tbody>
      </table>
    </div>`;
}

let lastQuery = "";
function backToResults() {
  dealsEl.innerHTML = "";
  if (lastQuery) searchGames(lastQuery);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

$("searchForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const q = $("q").value.trim();
  if (!q) return;
  lastQuery = q;
  searchGames(q);
});
</script>
</body>
</html>
